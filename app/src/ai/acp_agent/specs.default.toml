# What the panel's Model Specs card says about the agent's models (T21.2).
#
# Nothing here comes off the wire: the Agent Client Protocol carries a model's
# id, name and a sentence, and no number. Every bar the card draws for an
# agent's list is a value from this table, and the card's header says so.
#
# A copy of this file at <state dir>/fork/acp-model-specs.toml is read on top
# of it: a row there with the same `id` replaces the row here, a new `id` is
# added, and `as_of`/`source` there replace these. No rebuild.
#
# `input` and `output` are the vendor's list price in USD per million tokens.
# The card does not show them as dollars; it shows `output` relative to the
# dearest model the agent currently offers, dearest at full width, because on
# a subscription the dollar figure is not what a turn costs and the ratio is
# roughly how fast a turn spends the window.
#
# `intelligence` and `speed` are 0..1 and are this fork's ranking, an opinion
# written down so it can be argued with. They are not a benchmark. `class` is
# the one word the menu shows beside the name.
#
# `slug` is this model's id in the public catalogue `WARP_FORK_MODEL_PRICES=
# fetch` reads (T21.4). When the fetch is on and the catalogue carries that
# slug, its numbers replace `input`/`output` here and the card says where they
# came from and how old they are. When it is off, or the slug is unknown there,
# the numbers below stand. An agent whose model ids *are* catalogue slugs needs
# no row at all -- the id is looked up directly -- which is the case the fetch
# was built for and the case a hand-written table cannot serve.
#
# `id` is the agent's own id for the row. `opus[1m]` matches `opus`: a
# bracketed suffix is dropped before the lookup. A row whose description has
# no ` · ` (Claude Code's `default`, described as the model it resolves to)
# is looked up by the first word of that description, so `Opus (1M context)`
# finds `opus`.

as_of = "2026-09-07"
source = "https://platform.claude.com/docs/en/about-claude/pricing"

[[model]]
id = "fable"
slug = "anthropic/claude-fable-5.1"
class = "Frontier"
input = 10.0
output = 50.0
intelligence = 1.0
speed = 0.5

[[model]]
id = "opus"
slug = "anthropic/claude-opus-5"
class = "Flagship"
input = 5.0
output = 25.0
intelligence = 0.85
speed = 0.6

[[model]]
id = "sonnet"
slug = "anthropic/claude-sonnet-5"
class = "Everyday"
input = 2.0
output = 10.0
intelligence = 0.7
speed = 0.8

[[model]]
id = "haiku"
slug = "anthropic/claude-haiku-4.5"
class = "Fast"
input = 1.0
output = 5.0
intelligence = 0.4
speed = 0.9

# The local model, from `.fork/runs/localmodel-panel-2026-09-09/`: a
# llama-server on this machine answering the panel through
# `ANTHROPIC_BASE_URL`. Zero is the true price, and it draws an empty cost bar
# rather than a `?` for the one honest reason -- a turn on this model costs no
# tokens anybody bills. It has no `slug`: nothing in a public catalogue
# describes a file on this disk, and the fetch must not invent one.
#
# The ranking is deliberately not the vendor tiers' scale. Gemma 4 12B picked a
# tool, ran it and read the output back correctly on a one-step task (measured,
# same run); nothing there says it holds for a long multi-step turn, and the
# numbers say that rather than flattering it.
[[model]]
id = "gemma-4-12b"
class = "Local"
input = 0.0
output = 0.0
intelligence = 0.25
speed = 0.7
