<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Warp — console</title>
<style>
  :root { color-scheme: dark; --bg:#0e1116; --panel:#161b22; --line:#21262d; --dim:#8b949e; --fg:#c9d1d9; --hi:#e6edf3; --busy:#d29922; --block:#f85149; --ok:#3fb950; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display:flex; gap:.5rem; align-items:center; flex-wrap:wrap;
    padding:.55rem .8rem; background:var(--panel); border-bottom:1px solid var(--line);
  }
  header h1 { font-size:13px; font-weight:600; color:var(--hi); margin:0; letter-spacing:.02em; }
  .badge { font-size:11px; color:var(--dim); border:1px solid #30363d; border-radius:999px; padding:.05rem .5rem; white-space:nowrap; }
  .badge.live { color:var(--ok); border-color:#238636; }
  .badge.warn { color:var(--busy); border-color:#9e6a03; }
  .badge.bad  { color:var(--block); border-color:#762a26; }
  .spacer { flex:1 1 auto; }
  main { flex:1 1 auto; overflow:auto; -webkit-overflow-scrolling:touch; }
  section { border-bottom:1px solid var(--line); padding:.5rem .8rem .7rem; }
  h2 { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:.15rem 0 .5rem; font-weight:600; }
  .note { color:var(--dim); font-size:12px; }
  .note.bad { color:var(--block); }
  ul { list-style:none; margin:0; padding:0; }
  li { padding:.35rem 0; border-top:1px solid var(--line); }
  li:first-child { border-top:0; }
  .title { color:var(--hi); word-break:break-word; }
  .meta { color:var(--dim); font-size:11px; word-break:break-all; }
  .dot { display:inline-block; width:.5rem; height:.5rem; border-radius:50%; margin-right:.4rem; vertical-align:baseline; background:var(--dim); }
  .dot.busy { background:var(--busy); }
  .dot.block { background:var(--block); }
  .dot.ok { background:var(--ok); }
  /* The reason the page exists, so it gets the only accent colour and the only
     buttons. Touch targets are sized for a thumb, not a cursor. */
  #waiting li { padding:.55rem 0; }
  .ask { color:var(--hi); word-break:break-word; }
  .cmd { display:block; margin:.35rem 0 0; padding:.4rem .5rem; background:#0d1117;
         border:1px solid #30363d; border-radius:6px; white-space:pre-wrap; word-break:break-all; }
  .answers { display:flex; gap:.5rem; margin-top:.55rem; }
  .answers button {
    font:inherit; flex:1 1 0; min-height:2.75rem; border-radius:8px; cursor:pointer;
    background:#0d1117; color:var(--fg); border:1px solid #30363d;
  }
  .answers button.allow { border-color:#238636; color:var(--ok); }
  .answers button.allow.armed { background:#238636; color:#fff; border-color:#238636; }
  .answers button.deny { border-color:#762a26; color:var(--block); }
  .answers button[disabled] { opacity:.45; cursor:default; }
  #waiting h2 .badge.waiting { color:var(--block); border-color:#762a26; }
  #events li { display:grid; grid-template-columns:4.2rem 1fr; gap:.5rem; align-items:baseline; font-size:12px; }
  #events .t { color:var(--dim); font-variant-numeric:tabular-nums; }
  #events .k { color:var(--hi); }
  #events .d { color:var(--dim); word-break:break-word; }
  #events li.blocked .k { color:var(--block); }
  code { color:var(--fg); }
</style>
</head>
<body>
<header>
  <h1>warp</h1>
  <span class="badge" id="link">connecting</span>
  <span class="spacer"></span>
  <span class="badge" id="clock"></span>
</header>

<main>
  <section id="pairing" hidden>
    <h2>not paired</h2>
    <p class="note" id="pairing-note"></p>
  </section>

  <section id="waiting">
    <h2>waiting on you <span class="badge" id="waiting-count">0</span></h2>
    <ul id="approvals"></ul>
    <p class="note" id="waiting-note">checking…</p>
    <!-- Answering and listing fail differently and are cleared by different
         things, so they get different lines. Sharing one meant the refresh that
         follows a refused answer wiped the reason it was refused. -->
    <p class="note bad" id="waiting-error" hidden></p>
  </section>

  <section>
    <h2>Warp conversations <span class="badge" id="agents-count">0</span></h2>
    <ul id="agents"></ul>
    <p class="note" id="agents-note"></p>
  </section>

  <section>
    <h2>live events <span class="badge" id="events-count">0</span></h2>
    <ul id="events"></ul>
    <p class="note" id="events-note">waiting for the first event…</p>
  </section>
</main>

<script src="/console.js"></script>
</body>
</html>
